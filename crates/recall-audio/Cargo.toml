[package]
name = "recall-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
recall-store.workspace = true
anyhow.workspace = true
ogg = "0.9"
opus = "0.4"
# v0_3_44 exposes the `target.object` key used to follow the default sink.
pipewire = { version = "0.10", features = ["v0_3_44"] }
rtrb = "0.4"
rustix = { version = "1", features = ["time"] }
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
