[package]
name = "recall-pipeline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Lets this crate's build script pass the sherpa-onnx library directory to
# dependents as DEP_RECALL_SHERPA_LIB_DIR; see build.rs.
links = "recall_sherpa"

[dependencies]
recall-store.workspace = true
recall-llm.workspace = true
anyhow.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
bzip2 = "0.5"
tar = "0.4"
tempfile.workspace = true
whisper-rs = "0.16"
opencc = "0.3"

[dev-dependencies]
async-trait = "0.1"

[features]
vulkan = ["whisper-rs/vulkan"]
