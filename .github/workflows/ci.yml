name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev libspa-0.2-dev clang cmake pkg-config \
            libopencc-dev opencc ffmpeg

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            extension/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # rust-cache restores target/ build-script state but not
      # target/sherpa-onnx-prebuilt/, so sherpa-onnx-sys would skip its
      # download on a warm cache and linking would fail. Fetch the libraries
      # outside target/ and point both build scripts at them instead. The
      # version must match the sherpa-onnx pin in crates/recall-pipeline.
      - name: Fetch sherpa-onnx shared libraries
        env:
          SHERPA: sherpa-onnx-v2.0.1-linux-x64-shared-lib
        run: |
          curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$SHERPA.tar.bz2" \
            | tar -xj -C "$RUNNER_TEMP"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/$SHERPA/lib" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # PipeWire tests need a running session and stay off (RECALL_PW_TESTS
      # unset); tests that need downloaded models skip when they are absent.
      - name: cargo test
        run: cargo test --workspace

      - name: Web tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code dist

      - name: Extension tests and build
        working-directory: extension
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code dist

      - name: Bench tests
        run: python3 -m unittest bench/test_run.py
