[workspace]
resolver = "3"
members = [
    "crates/recall-store",
    "crates/recall-audio",
    "crates/recall-llm",
    "crates/recall-pipeline",
    "crates/recall-server",
    "crates/recall-mcp",
    "crates/recall",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

recall-store = { path = "crates/recall-store" }
recall-audio = { path = "crates/recall-audio" }
recall-llm = { path = "crates/recall-llm" }
recall-pipeline = { path = "crates/recall-pipeline" }
recall-server = { path = "crates/recall-server" }
recall-mcp = { path = "crates/recall-mcp" }
